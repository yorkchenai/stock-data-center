name: BaoStock backup candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'requests/baostock-candidate-*.json'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install baostock
      - name: Test independent BaoStock data
        run: python scripts/test_baostock_candidate.py
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baostock-candidate-report
          path: results/baostock_candidate_test.json
      - name: Publish report without touching production CSV
        if: always()
        run: |
          if [ ! -f results/baostock_candidate_test.json ]; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/baostock_candidate_test.json
          if ! git diff --cached --quiet; then
            git commit -m "test: BaoStock candidate report [skip ci]"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main || exit 1
            done
            exit 1
          fi
