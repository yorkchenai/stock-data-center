name: Live fund chart review

on:
  pull_request:
    paths:
      - ".github/workflows/fund-chart-review.yml"
      - "stock_analysis/fund_charts.py"
      - "stock_analysis/sector_data.py"
      - "web/funds/**"
      - "web/funds.html"
      - "scripts/test_live_fund_charts.mjs"
      - "scripts/verify_fund_chart_observations.py"
      - "scripts/audit_sector_volume.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund-chart-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  volume-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.audit_sector_volume --output work/sector-volume/observations.json
      - uses: actions/upload-artifact@v4
        with:
          name: sector-volume-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/sector-volume/observations.json
          if-no-files-found: error
          retention-days: 14
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Install fonts for Chinese chart labels
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify real data and desktop/mobile charts on the loopback service
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          mkdir -p work/fund-chart-review
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          python -m stock_analysis.web --port 8766 > work/loopback-funds.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for wait in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8766/api/funds/status > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test_live_fund_charts.mjs
          python -m scripts.verify_fund_chart_observations work/fund-chart-review/observations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fund-chart-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/fund-chart-review/*.png
            work/fund-chart-review/observations.json
          if-no-files-found: error
          retention-days: 14
