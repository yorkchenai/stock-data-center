name: Generate stock indicator charts
on:
  push:
    paths:
      - 'chart_requests/*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install chart dependencies
        run: python -m pip install 'pandas>=2,<3' 'numpy>=1.24,<3' 'matplotlib>=3.7,<4'
      - name: Generate five charts from existing validated CSV
        run: python scripts/generate_indicators.py
      - name: Publish charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/charts/
          if ! git diff --cached --quiet; then
            git commit -m "charts: update five indicator figures [skip ci]"
            git push
          fi
