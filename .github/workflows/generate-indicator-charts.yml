name: Generate stock indicator charts
on:
  push:
    paths:
      - 'chart_requests/*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate five charts from existing validated CSV
        run: python scripts/generate_indicators.py
      - name: Preserve isolated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicator-charts-000688
          path: results/sh000688_index/
          if-no-files-found: error
