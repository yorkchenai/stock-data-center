name: On-demand stock fetch
on:
  push:
    paths:
      - 'requests/*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tencent fallback dependencies
        run: python -m pip install 'akshare>=1.14' 'pandas>=2,<3'
      - name: Fetch latest request
        run: |
          python scripts/test_kechuang50.py
      - name: Validate saved market data
        if: success()
        run: |
          mkdir -p results
          cp kechuang50_daily.csv results/000688_daily.csv
          python scripts/validate_kechuang50.py
          python -m pip install 'exchange-calendars>=4,<5'
          python scripts/audit_exchange_calendar.py
      - name: Publish result
        if: always()
        run: |
          mkdir -p results
          if [ -f test_result.json ]; then cp test_result.json results/000688_result.json; fi
          if [ -f results/000688_validation.json ]; then echo 'Validation report available'; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "data: on-demand fetch result [skip ci]"
            git push
          fi
