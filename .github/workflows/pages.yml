name: Pages build and deployment
on:
  pull_request:
    paths:
      [
        "web/**",
        "stock_analysis/**",
        "scripts/*pages*",
        "scripts/calculate_browser_indicators.mjs",
        "tests/**",
        "package*.json",
        "requirements.txt",
        ".github/workflows/pages.yml",
        ".github/pages-worker-build.json",
      ]
  push:
    branches: [main]
    paths:
      [
        "web/**",
        "stock_analysis/**",
        "scripts/*pages*",
        "scripts/calculate_browser_indicators.mjs",
        "tests/**",
        "package*.json",
        "requirements.txt",
        ".github/workflows/pages.yml",
        ".github/pages-worker-build.json",
      ]
  workflow_dispatch:
permissions:
  contents: read
env:
  SNAPSHOT_SERVICE: https://stock-data-center-voice-probe.finalnoodle2.chatgpt.site
  PAGES_ORIGIN: https://yorkchenai.github.io
  PAGES_URL: https://yorkchenai.github.io/stock-data-center
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: python -m stock_analysis.pages --output work/pages-site
      - name: Desktop and mobile layout tests
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          npm run test:browser
      - name: Save reviewable site and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/pages-site/
            work/pages-browser/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages-site
  live-probe:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m stock_analysis.pages --output work/probe-root/stock-data-center
      - name: Probe live CORS and JSONP from a local HTTP origin
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory work/probe-root > work/probe-server.log 2>&1 &
          probe_server_pid=$!
          trap 'kill "$probe_server_pid"' EXIT
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          PAGES_URL=http://127.0.0.1:8765/stock-data-center/ node scripts/probe_pages_sources.mjs
      - name: Python raw-response adapter and indicator comparison
        if: always()
        run: python -m scripts.verify_pages_live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pages-live/
          retention-days: 30
          if-no-files-found: error
  production-artifact:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      files_sha: ${{ steps.build.outputs.files_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Build the current main commit against the deployed Worker contract
        id: build
        env:
          PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m stock_analysis.pages --output work/pages-site --snapshot-service "$SNAPSHOT_SERVICE" \
            --snapshot-reference .github/pages-worker-build.json
          cd work/pages-site
          jq -e --arg sha "$GITHUB_SHA" '.commit_sha == $sha and .schema_version == 1' build-info.json
          sha256sum build-info.json index.html app.mjs data.mjs timeframes.mjs style.css funds.html funds/app.mjs funds/valuation.mjs funds/valuation-source.mjs \
            funds/funds.css fund-benchmark-disclosures.json fund-config.json calendar.json > release-sha256.txt
          echo "files_sha=$(sha256sum release-sha256.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Check worker inputs and Pages CORS before uploading
        run: |
          analysis_url="$SNAPSHOT_SERVICE/api/analysis"
          expected_model="$(jq -r .analysis_model_version work/pages-site/build-info.json)"
          cors_matches() {
            test "$(tr -d '\r' < worker-response.headers | awk 'tolower($1) == "access-control-allow-origin:" {print $2}')" = "$PAGES_ORIGIN"
          }
          for attempt in $(seq 1 10); do
            if status="$(curl -sS --max-time 12 -D worker-response.headers -o worker-response.json -w '%{http_code}' \
                -H "Origin: $PAGES_ORIGIN" "$analysis_url?release_probe=$GITHUB_RUN_ID-$attempt")" \
                && [ "$status" = 400 ] && cors_matches \
                && jq -e '.schema_version == 1 and .status == "invalid_arguments"' worker-response.json >/dev/null \
                && curl -fsS --max-time 12 -D worker-response.headers -o worker-response.json \
                  -H "Origin: $PAGES_ORIGIN" "$analysis_url?asset_type=fund&symbol=110022" \
                && cors_matches \
                && jq -e --arg model "$expected_model" '.schema_version == 1 and .model_version == $model and
                  (.status == "complete" or .status == "partial") and (.snapshot_id | type == "string")' worker-response.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo 'The deployed Worker did not serve a compatible snapshot to the Pages origin'
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages-site
  deploy:
    needs: production-artifact
    # Only main can deploy, including manual runs. PRs keep read-only checks.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
  deployed-probe:
    needs: [production-artifact, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_FILES_SHA: ${{ needs.production-artifact.outputs.files_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published build and its files against the release job
        run: |
          mkdir -p work/published-pages
          cd work/published-pages
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 8 "$PAGES_URL/release-sha256.txt?release=$GITHUB_RUN_ID-$attempt" -o release-sha256.txt \
                && echo "$EXPECTED_FILES_SHA  release-sha256.txt" | sha256sum -c --status; then
              while read -r checksum file; do
                mkdir -p "$(dirname "$file")"
                curl -fsS --max-time 12 "$PAGES_URL/$file?release=$GITHUB_RUN_ID" -o "$file"
              done < release-sha256.txt
              sha256sum -c release-sha256.txt
              jq -e --arg sha "$GITHUB_SHA" '.schema_version == 1 and .commit_sha == $sha' build-info.json
              model="$(jq -r .analysis_model_version build-info.json)"
              for page in index.html funds.html; do
                grep -Fq "data-analysis-model=\"$model\"" "$page"
                grep -Fq "data-analysis-origin=\"$SNAPSHOT_SERVICE\"" "$page"
              done
              exit 0
            fi
            sleep 5
          done
          echo 'The matching Pages release did not become visible'
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the live fund page and valuation refresh behavior
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/verify_deployed_fund_pages.mjs
