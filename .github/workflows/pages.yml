name: Pages build and deployment
on:
  pull_request:
    paths:
      [
        "web/**",
        "stock_analysis/**",
        "config/snapshots.json",
        "scripts/*pages*",
        "scripts/calculate_browser_indicators.mjs",
        "tests/**",
        "package*.json",
        "requirements.txt",
        ".github/workflows/pages.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "web/**",
        "stock_analysis/**",
        "config/snapshots.json",
        "scripts/*pages*",
        "scripts/calculate_browser_indicators.mjs",
        "tests/**",
        "package*.json",
        "requirements.txt",
        ".github/workflows/pages.yml",
      ]
  schedule:
    # Rebuild the calendar and daily snapshots at 17:20 Shanghai time.
    - cron: "20 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: python -m stock_analysis.pages --output work/pages-site
      - name: Desktop and mobile layout tests
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          npm run test:browser
      - name: Save reviewable site and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/pages-site/
            work/pages-browser/
          retention-days: 30
          if-no-files-found: error
      - name: Build the public snapshot directory
        run: |
          options=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_REF" != refs/heads/main ]]; then
            options+=(--metadata-only)
          fi
          python -m stock_analysis.snapshots --output work/pages-site/data/v1 "${options[@]}" > work/snapshot-report.json
      - name: Save the snapshot validation report
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/snapshot-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Save the exact snapshot bytes for GitHub Raw
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-data-v1
          path: work/pages-site/data/v1/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: work/pages-site
  live-probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m stock_analysis.pages --output work/probe-root/stock-data-center
      - name: Probe live CORS and JSONP from a local HTTP origin
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory work/probe-root > work/probe-server.log 2>&1 &
          probe_server_pid=$!
          trap 'kill "$probe_server_pid"' EXIT
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          PAGES_URL=http://127.0.0.1:8765/stock-data-center/ node scripts/probe_pages_sources.mjs
      - name: Python raw-response adapter and indicator comparison
        if: always()
        run: python -m scripts.verify_pages_live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-probe-${{ github.run_id }}-${{ github.run_attempt }}
          # Keep raw responses and full daily rows on the runner for validation only.
          path: |
            work/pages-live/probe.json
            work/pages-live/python-comparison.json
          retention-days: 30
          if-no-files-found: error
  publish-raw:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pages-data-v1
          path: work/raw-data
      - name: Update the GitHub Raw snapshot branch
        run: bash scripts/mirror_pages_snapshots.sh work/raw-data
  deploy:
    needs: [build, live-probe]
    # Only main can deploy, including manual runs. PRs keep read-only checks.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
  deployed-probe:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Verify the actual GitHub Pages origin
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          PAGES_URL=https://yorkchenai.github.io/stock-data-center/ node scripts/probe_pages_sources.mjs
      - if: always()
        run: python -m scripts.verify_pages_live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-deployed-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/pages-live/probe.json
            work/pages-live/python-comparison.json
          retention-days: 30
          if-no-files-found: error
