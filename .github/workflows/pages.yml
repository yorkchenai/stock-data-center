name: Pages build and deployment
on:
  pull_request:
    paths:
      [
        "web/**",
        "stock_analysis/**",
        "scripts/*pages*",
        "scripts/calculate_browser_indicators.mjs",
        "tests/**",
        "package*.json",
        "requirements.txt",
        ".github/workflows/pages.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "web/**",
        "stock_analysis/**",
        "scripts/*pages*",
        "scripts/calculate_browser_indicators.mjs",
        "tests/**",
        "package*.json",
        "requirements.txt",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: python -m stock_analysis.pages --output work/pages-site
      - name: Desktop and mobile layout tests
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          npm run test:browser
      - name: Save reviewable site and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/pages-site/
            work/pages-browser/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages-site
  live-probe:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m stock_analysis.pages --output work/probe-root/stock-data-center
      - name: Probe live CORS and JSONP from a local HTTP origin
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory work/probe-root > work/probe-server.log 2>&1 &
          probe_server_pid=$!
          trap 'kill "$probe_server_pid"' EXIT
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          PAGES_URL=http://127.0.0.1:8765/stock-data-center/ node scripts/probe_pages_sources.mjs
      - name: Python raw-response adapter and indicator comparison
        if: always()
        run: python -m scripts.verify_pages_live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pages-live/
          retention-days: 30
          if-no-files-found: error
  production-artifact:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the paired Worker v14 Pages payload
        env:
          PAGES_ARCHIVE: https://raw.githubusercontent.com/yorkchenai/stock-data-center/26e8b02fd36dc012625f417b95278385837bfdd8/pages-candidate.tar.gz
          ANALYSIS_URL: https://stock-data-center-voice-probe.finalnoodle2.chatgpt.site/api/analysis
        run: |
          curl -fsS --retry 3 --max-time 25 "$PAGES_ARCHIVE" -o pages-candidate.tar.gz
          echo 'ab710cd97ca34e24db3ca0c6936bd3567f486183e71272e6724f8015a784ce04  pages-candidate.tar.gz' | sha256sum -c -
          mkdir -p work/pages-site
          tar -xzf pages-candidate.tar.gz -C work/pages-site
          echo 'd98ff21cad7a08593c58cea437c1a5d9254e63c3ee5031f56053a520f0a76499  work/pages-site/build-info.json' | sha256sum -c -
          for attempt in $(seq 1 24); do
            status="$(curl -sS --max-time 8 -D worker-response.headers -o worker-response.json -w '%{http_code}' \
              -H 'Origin: https://yorkchenai.github.io' "$ANALYSIS_URL?release_probe=$GITHUB_RUN_ID-$attempt")"
            if [ "$status" = 400 ] \
                && jq -e '.status == "invalid_arguments"' worker-response.json >/dev/null \
                && grep -qi '^access-control-allow-origin: https://yorkchenai.github.io' worker-response.headers; then
              exit 0
            fi
            sleep 5
          done
          echo 'The paired Worker did not accept the Pages origin'
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages-site
  deploy:
    needs: production-artifact
    # Only main can deploy, including manual runs. PRs keep read-only checks.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
  deployed-probe:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGES_URL: https://yorkchenai.github.io/stock-data-center
    steps:
      - name: Verify the published paired Pages build
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 8 "$PAGES_URL/build-info.json?release=$GITHUB_RUN_ID-$attempt" -o build-info.json \
              && echo 'd98ff21cad7a08593c58cea437c1a5d9254e63c3ee5031f56053a520f0a76499  build-info.json' | sha256sum -c --status; then
              for page in index.html funds.html; do
                curl -fsS --max-time 12 "$PAGES_URL/$page?release=$GITHUB_RUN_ID" -o "$page"
                grep -q 'data-analysis-model="analysis-v1-8ea238b017daab1d6201"' "$page"
                grep -q 'data-analysis-origin="https://stock-data-center-voice-probe.finalnoodle2.chatgpt.site"' "$page"
              done
              exit 0
            fi
            sleep 5
          done
          echo 'The matched Pages build did not become visible'
          exit 1
