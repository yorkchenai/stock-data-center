name: Offline analysis tests
on:
  pull_request:
    paths:
      - 'stock_analysis/**'
      - 'tests/**'
      - 'scripts/generate_indicators.py'
      - 'requirements.txt'
      - '.github/workflows/test-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
