name: Trace the published valuation requests
on:
  push:
    branches: [ops/valuation-live-diagnostics]
    paths: [.github/workflows/valuation-live-diagnostics.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { chromium } from "playwright-core";
          const origin = "https://yorkchenai.github.io";
          const worker = "https://stock-data-center-voice-probe.finalnoodle2.chatgpt.site";
          const browser = await chromium.launch({executablePath:process.env.CHROMIUM_PATH,args:["--no-sandbox"]});
          const now = new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Shanghai",dateStyle:"short",timeStyle:"medium"}).format(new Date());
          const codes = ["019830","014194","018993","110022"];
          try {
            const page = await browser.newPage();
            await page.goto(origin+"/stock-data-center/build-info.json");
            const result = await page.evaluate(async ({worker,codes})=>{
              return Promise.all(codes.map(async (symbol)=>{
                const sources = await Promise.all(["eastmoney","sina"].map(async (provider)=>{
                  const start = performance.now();
                  try {
                    const url = new URL("/api/fund-valuation",worker);
                    url.search = new URLSearchParams({symbol,provider});
                    const response = await fetch(url,{credentials:"omit",signal:AbortSignal.timeout(10_000)});
                    const body = await response.json();
                    return {provider,http:response.status,ms:Math.round(performance.now()-start),status:body.status,
                      returned_symbol:body.symbol,values:body.values?.map(({id,change,updatedAt})=>({id,change,updatedAt}))};
                  } catch(error) {return {provider,error:String(error.message).slice(0,120)};}
                }));
                return {symbol,sources};
              }));
            },{worker,codes});
            const mcp = await fetch(worker+"/mcp",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/event-stream"},
              body:JSON.stringify({jsonrpc:"2.0",id:1,method:"tools/list"}),signal:AbortSignal.timeout(10_000)});
            console.log(JSON.stringify({as_of:now,origin,anonymous_mcp:mcp.status,result},null,2));
            assert.ok([401,403].includes(mcp.status));
            for (const fund of result) {
              const estimates = fund.sources.flatMap((source)=>source.values??[]);
              assert.ok(estimates.length,fund.symbol+" has no current-day estimate through the Worker");
              assert.ok(estimates.every(({updatedAt})=>updatedAt?.startsWith(now.slice(0,10))));
            }
          } finally {await browser.close();}
          JS
